name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Interop Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit via Moonup
        uses: chawyehsu/setup-moonup@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyzmq tornado

      - name: Check code
        run: moon check --target native

      - name: Run MoonBit unit & property test suite
        run: moon test --target native

      - name: Build all native binaries & examples
        run: moon build --target native

      - name: Run REQ/REP Example
        run: moon -C examples/req_rep run . --target native

      - name: Run PUB/SUB Example
        run: moon -C examples/pub_sub run . --target native

      - name: Run Pipeline Example
        run: moon -C examples/pipeline run . --target native

      - name: Run Router/Dealer Example
        run: moon -C examples/router_broker run . --target native

      - name: Run Proxy Broker Example
        run: moon -C examples/proxy_broker run . --target native

      - name: Run Poller Multiplex Example
        run: moon -C examples/poller_multiplex run . --target native

      - name: Run pyzmq (libzmq) Bidirectional Interoperability Test Suite
        run: python -m unittest -v tests/interop/test_interop.py

      - name: Run Cross-Language Benchmark Suite
        run: python -m unittest -v tests/interop/test_benchmark.py
