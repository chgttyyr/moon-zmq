name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Interop Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MoonBit via Moonup
        uses: chawyehsu/setup-moonup@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyzmq tornado

      - name: Check code (no warnings allowed)
        run: moon check --target native --deny-warn

      - name: Run MoonBit unit & property test suite
        run: moon test --target native

      - name: Build all native binaries & examples
        run: moon build --target native

      - name: Run REQ/REP Example
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./_build/native/debug/build/examples/req_rep/req_rep.exe
          else
            ./_build/native/debug/build/examples/req_rep/req_rep
          fi
        shell: bash

      - name: Run PUB/SUB Example
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./_build/native/debug/build/examples/pub_sub/pub_sub.exe
          else
            ./_build/native/debug/build/examples/pub_sub/pub_sub
          fi
        shell: bash

      - name: Run Pipeline Example
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./_build/native/debug/build/examples/pipeline/pipeline.exe
          else
            ./_build/native/debug/build/examples/pipeline/pipeline
          fi
        shell: bash

      - name: Run Router/Dealer Example
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./_build/native/debug/build/examples/router_broker/router_broker.exe
          else
            ./_build/native/debug/build/examples/router_broker/router_broker
          fi
        shell: bash

      - name: Run pyzmq (libzmq) Bidirectional Interoperability Test Suite
        run: python -m unittest -v tests/interop/test_interop.py
